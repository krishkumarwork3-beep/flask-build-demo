version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Starting tests at $(date)"
  build:
    commands:
      - python -m pytest -v --junitxml=reports/pytest.xml
  post_build:
    commands:
      - echo "Build finished. Succeeding=$CODEBUILD_BUILD_SUCCEEDING"

artifacts:
  files:
    - app.py
    - requirements.txt
    - reports/pytest.xml
  name: flask-app-build
